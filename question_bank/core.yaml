version: "0.2"
name: "AIR4 Question Bank — CORE"
description: "Fast signals (<=1s), no free text. Used for state detection & flow control."
conventions:
  answers:
    yes_no: [yes, no]
    tri_level: [low, mid, high]
  domains:
    - energy_state
    - focus_attention
    - emotion_regulation
    - control_agency_pressure
    - motivation_drive
    - risk_defense
    - identity_self_image
    - action_execution
    - social_relational
    - time_temporal
    - body_physiology
    - cognition_bias
    - learning_growth
    - environment_context
    - work_load
    - focus_chaos
    - body_sport
    - interests_hobbies
    - finances_perception
    - thinking_decisions

